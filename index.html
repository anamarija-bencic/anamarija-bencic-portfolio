<!DOCTYPE html>
<html lang="hr" data-lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Anamarija Benčić — Portfolio</title>
<meta name="description" content="Video portfolio — Anamarija Benčić">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;800&display=swap">
<style>
:root{
  --bg:#ECECE8; --ink:#3A3A3A; --red:#BC2630; --muted:#75746d; --line:rgba(58,58,58,.2);
  --card:#E2E2DD; --poster:#2B2A29; --poster-ink:#ECECE8; --on-red:#ECECE8;
  --font:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1D1C; --ink:#E8E8E3; --red:#E2454F; --muted:#a2a199; --line:rgba(232,232,227,.2);
    --card:#272625; --poster:#121211; --on-red:#1E1D1C;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1D1C; --ink:#E8E8E3; --red:#E2454F; --muted:#a2a199; --line:rgba(232,232,227,.2);
  --card:#272625; --poster:#121211; --on-red:#1E1D1C;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
html[data-lang="hr"] .l-en{display:none}
html[data-lang="en"] .l-hr{display:none}
.wrap{max-width:1360px;margin:0 auto;padding:0 clamp(18px,4vw,56px)}
.red{color:var(--red)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.brand{font-weight:800;text-transform:uppercase;letter-spacing:-.02em;color:var(--red);text-decoration:none;font-size:1.05rem}
nav.main{display:flex;gap:clamp(12px,2vw,28px);align-items:center;flex-wrap:wrap}
nav.main a{text-decoration:none;font-size:.9rem;font-weight:500;padding:4px 0;border-bottom:2px solid transparent}
nav.main a:hover{border-color:var(--red)}
.lang{display:flex;gap:2px;align-items:center;font-weight:600;font-size:.9rem;margin-left:8px}
.lang button{font:inherit;background:none;border:0;color:var(--muted);padding:6px 8px;cursor:pointer;border-radius:2px}
.lang button[aria-pressed="true"]{color:var(--red);box-shadow:inset 0 -2px 0 var(--red)}
.lang span.sep{color:var(--line)}
@media(max-width:760px){
  nav.main{width:100%;justify-content:space-between;gap:8px}
  .brand{display:none}
  nav.main .navlinks{gap:14px!important}
  nav.main a{font-size:.85rem}
}

/* hero */
.hero{padding:clamp(28px,6vw,72px) 0 clamp(36px,6vw,80px)}
.hero .bar{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:clamp(.95rem,1.6vw,1.35rem);font-weight:300}
.hero .bar b{font-weight:600}
h1.name{margin:clamp(14px,3vw,36px) 0 0;color:var(--red);font-weight:800;text-transform:uppercase;letter-spacing:-.045em;line-height:.84;font-size:clamp(3.1rem,15.5vw,13.5rem)}
h1.name span{display:block}
.hero .lead{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,5vw,80px);margin-top:clamp(28px,5vw,64px);align-items:start}
.hero .headline{font-size:clamp(1.15rem,2.2vw,1.8rem);font-weight:600;line-height:1.2;letter-spacing:-.01em;margin:0}
.hero .intro{font-size:1.02rem;max-width:62ch;margin:0 0 22px}
.btn{display:inline-block;font:inherit;font-weight:600;text-decoration:none;background:var(--red);color:var(--on-red);padding:12px 22px;border:2px solid var(--red);border-radius:2px;cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:transparent;color:var(--red)}
.btn.ghost{background:transparent;color:var(--red)}
.btn.ghost:hover{background:var(--red);color:var(--on-red)}
@media(max-width:760px){.hero .lead{grid-template-columns:1fr}}

/* section heads */
section{padding:clamp(36px,6vw,80px) 0;border-top:1px solid var(--line)}
h2{margin:0;color:var(--red);font-weight:600;font-size:clamp(1.7rem,3.8vw,3rem);letter-spacing:-.025em;line-height:1.05}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;margin-bottom:clamp(20px,3vw,36px)}
.sec-head p{margin:0;color:var(--muted);max-width:52ch;font-size:.95rem}
h3.sub{margin:clamp(24px,4vw,44px) 0 16px;font-size:1.1rem;font-weight:600;display:flex;align-items:center;gap:14px}
h3.sub::after{content:"";flex:1;height:1px;background:var(--line)}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.filters button{font:inherit;font-size:.92rem;font-weight:500;background:transparent;color:var(--ink);border:1.5px solid var(--line);padding:8px 16px;border-radius:999px;cursor:pointer;transition:all .2s}
.filters button:hover{border-color:var(--red)}
.filters button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:5;background:var(--bg);padding:12px 0}
.cat[hidden]{display:none}

/* grids */
.grid{display:grid;gap:clamp(16px,2.4vw,32px)}
.grid.land{grid-template-columns:repeat(2,1fr)}
.grid.port{grid-template-columns:repeat(4,1fr)}
.grid.one{grid-template-columns:minmax(0,640px)}
@media(max-width:900px){.grid.port{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid.land{grid-template-columns:1fr}}

/* card */
.card{display:flex;flex-direction:column;min-width:0}
.poster{position:relative;display:block;width:100%;background:var(--poster);color:var(--poster-ink);overflow:hidden;border-radius:2px;text-decoration:none}
.poster.land{aspect-ratio:16/9}
.poster.reel{aspect-ratio:9/16}
.poster.post{aspect-ratio:4/5}
.poster.land::before,.poster.land::after{content:"";position:absolute;left:0;right:0;height:9%;background:#000;z-index:1}
.poster.land::before{top:0}.poster.land::after{bottom:0}
.poster .inner{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(14px,2vw,26px);z-index:2}
.poster.land .inner{padding:calc(9% + 12px) clamp(14px,2.4vw,30px)}
.poster .plat{font-size:.78rem;font-weight:500;opacity:.75;display:flex;align-items:center;gap:8px}
.poster .plat i{width:7px;height:7px;background:var(--red);border-radius:50%;display:inline-block}
.poster .ptitle{font-weight:800;text-transform:uppercase;letter-spacing:-.03em;line-height:.95;font-size:clamp(1.3rem,3.2vw,2.6rem);word-break:break-word}
.poster.reel .ptitle,.poster.post .ptitle{font-size:clamp(1.05rem,1.9vw,1.6rem)}
.poster .ptitle em{font-style:normal;color:var(--red);display:block}
.poster .act{display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:600}
.play,.ext{width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;display:inline-flex;align-items:center;justify-content:center;border:0;flex:none;transition:transform .2s}
.play svg,.ext svg{width:18px;height:18px;fill:currentColor}
button.poster{border:0;padding:0;font:inherit;cursor:pointer;text-align:left}
.poster:hover .play,.poster:hover .ext{transform:scale(1.1)}
.poster iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:3;background:#000}
.meta{padding:12px 2px 0;display:flex;flex-direction:column;gap:4px}
.role{font-size:.95rem;font-weight:500}
.role small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.links{display:flex;gap:16px;flex-wrap:wrap;font-size:.88rem}
.links a{font-weight:600;color:var(--red);text-underline-offset:3px}
.note{font-size:.8rem;color:var(--muted);margin:2px 0 0}
.note[hidden]{display:none}

/* campaign collection */
.collection{background:var(--red);color:var(--on-red);padding:clamp(18px,3.5vw,44px);margin-top:clamp(20px,3vw,36px);border-radius:2px}
.collection h3{margin:0;font-weight:800;text-transform:uppercase;letter-spacing:-.04em;line-height:.9;font-size:clamp(2rem,6.5vw,5.2rem)}
.collection p{max-width:60ch;margin:16px 0 clamp(18px,3vw,32px);font-size:1rem}
.collection .meta .role small{color:inherit;opacity:.8}
.collection .links a{color:inherit}
.collection .poster{background:var(--poster)}
.collection .grid.port{grid-template-columns:repeat(5,1fr)}
@media(max-width:1000px){.collection .grid.port{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.collection .grid.port{grid-template-columns:repeat(2,1fr)}}
.collection .poster .ptitle{font-size:clamp(.95rem,1.5vw,1.3rem)}

/* background */
.about{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,3vw,40px)}
.about article{border-top:2px solid var(--red);padding-top:14px}
.about h4{margin:0 0 2px;font-size:1.05rem;font-weight:600}
.about .when{color:var(--muted);font-size:.85rem;margin:0 0 10px}
.about ul{margin:0;padding-left:1.1em;font-size:.93rem}
.tools{margin-top:28px;font-size:.95rem}
.tools b{font-weight:600}
@media(max-width:900px){.about{grid-template-columns:1fr}}

/* thumbnails, scrim, preview buttons, context notes */
.thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.poster .scrim{display:none;position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 35%,transparent 60%,rgba(0,0,0,.65))}
.poster.has-thumb .scrim{display:block}
.poster.has-thumb .ptitle{display:none}
.links button{font:inherit;font-weight:600;color:var(--red);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.collection .links button{color:inherit}
.ctx{max-width:78ch;margin:0 0 18px;font-size:.95rem}
.ctx a{color:var(--red);font-weight:600;text-underline-offset:3px}
.collection .btn{background:var(--on-red);color:var(--red);border-color:var(--on-red)}
.collection .btn:hover{background:transparent;color:var(--on-red)}
dialog.ig{border:0;padding:0;background:var(--bg);color:var(--ink);width:min(440px,94vw);max-height:94vh;border-radius:2px}
dialog.ig::backdrop{background:rgba(0,0,0,.7)}
dialog.ig .dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.9rem;font-weight:600}
dialog.ig .dh button{font:inherit;font-weight:600;background:none;border:0;color:var(--red);cursor:pointer;padding:6px}
dialog.ig iframe{display:block;width:100%;height:min(78vh,720px);border:0;background:#fff}
dialog.ig .fail{padding:22px 18px;margin:0}
dialog.ig .fail a{color:var(--red);font-weight:600}

/* cv */
.cvsec{margin-top:clamp(28px,4vw,52px)}
.cvsec>h3{margin:0 0 6px;color:var(--red);font-weight:600;font-size:clamp(1.3rem,2.4vw,1.8rem);letter-spacing:-.02em}
.cvabout{max-width:80ch;margin:0}
.cvrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:clamp(14px,3vw,48px);border-top:1px solid var(--line);padding:18px 0}
.cvrow h4{margin:0;font-size:1rem;font-weight:600}
.cvrow .org{margin:2px 0 0;font-weight:300;font-size:1.05rem}
.cvrow .org a{color:inherit}
.cvrow ul{margin:0;padding-left:1.1em;font-size:.95rem}
.cvrow li+li{margin-top:3px}
.cv2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,64px)}
.cv2 ul{margin:10px 0 0;padding-left:1.1em;font-size:.95rem}
.cv2 li+li{margin-top:3px}
.cv2 .edu{border-top:1px solid var(--line);padding:16px 0}
.cv2 .edu p{margin:2px 0 0;font-size:.95rem}
.cv2 .edu .org{font-weight:300}
@media(max-width:760px){.cvrow,.cv2{grid-template-columns:1fr}}

/* contact */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,5vw,80px)}
.contact dl{margin:0;display:grid;gap:22px}
.contact dt{font-weight:600;font-size:.9rem;color:var(--muted)}
.contact dd{margin:2px 0 0;font-size:clamp(1.2rem,2.6vw,2rem);font-weight:300;letter-spacing:-.01em;word-break:break-word}
.contact dd a{text-decoration:none;border-bottom:2px solid var(--red)}
.contact dd a:hover{color:var(--red)}
@media(max-width:760px){.contact{grid-template-columns:1fr}}

footer{border-top:1px solid var(--line);padding:28px 0 40px;font-size:.88rem;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer b{color:var(--ink);font-weight:600}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

function ytId(url){
  try{
    const u = new URL(url);

    return u.searchParams.get("v");
  }catch(e){ return null; }
}

/* ============ RENDER ============ */
function posterTitle(p, opts={}){
  if(p.group){ return `<span class="ptitle"><em>72 sata</em>${p.short}</span>`; }
  return `<span class="ptitle">${p.ytTitle ? p.ytTitle : pairObj(p.title)}</span>`;
}
function platLabel(p){ return p.platform === "youtube" ? "YouTube" : "Instagram"; }

function card(p){
  const kind = p.platform==="youtube" ? "land" : (p.format==="post" ? "post" : "reel");
  const aria = `${p.title.en}`;
  let posterHtml, linkHtml;
  if(p.platform==="youtube"){
    posterHtml = `<button type="button" class="poster ${kind}" data-play="${p.id}" aria-label="${tx("play")}: ${aria}">
      <span class="scrim"></span><span class="inner"><span class="plat"><i></i>YouTube</span>${posterTitle(p)}
      <span class="act"><span class="play">${ICON_PLAY}</span>${pair("play_here")}</span></span></button>`;
    linkHtml = `<a href="${p.url}" target="_blank" rel="noopener noreferrer">${pair("open_yt")}</a>`;
  } else {
    posterHtml = `<a class="poster ${kind}" href="${p.url}" target="_blank" rel="noopener noreferrer" aria-label="${tx("open_ig")}: ${aria}">
      <span class="inner"><span class="plat"><i></i>Instagram</span>${posterTitle(p)}
      <span class="act"><span class="ext">${ICON_EXT}</span>${pair("open_ig")}</span></span></a>`;
    linkHtml = `<a href="${p.url}" target="_blank" rel="noopener noreferrer">${pair("open_ig")}</a><button type="button" data-igplay="${p.id}">${pair("preview_ig")}</button>`;
  }
  const title = p.group ? "" : `<div class="role ctitle" style="font-weight:600">${pairObj(p.title)}</div>`;
  return `<article class="card" id="p${p.id}">
    ${posterHtml}
    <div class="meta">
      ${title}
      <div class="role"><small>${pair("role_label")}</small>${pairObj(p.role)}</div>
      ${p.business?`<div class="role"><small>${pair("business_label")}</small><a href="${p.business.url}" target="_blank" rel="noopener noreferrer" style="text-underline-offset:3px">${p.business.name}</a></div>`:""}
      <div class="links">${linkHtml}</div>
      <p class="note" hidden>${pair("embed_note")}</p>
    </div></article>`;
}

function gridFor(list){
  const first = list[0];
  const cls = first.platform==="youtube" ? "land" : "port";
  const count = list.length;
  return `<div class="grid ${count===1 && cls==="port" ? "port" : cls}">${list.map(card).join("")}</div>`;
}

function renderCatalog(){
  const cats = {
    film:{subs:["short","music"]}, camp:{subs:["engaged"]}, social:{subs:["smallbiz"]}, academic:{subs:["academic"]}
  };
  let html = "";
  for(const c of CATS){
    const items = PROJECTS.filter(p=>p.cat===c);
    html += `<div class="cat" data-cat="${c}" id="cat-${c}">
      <div class="sec-head" style="margin-top:clamp(28px,5vw,56px);margin-bottom:0">
        <h2 style="font-size:clamp(1.4rem,2.8vw,2.2rem)">${pair("cat_"+c)}</h2>
        <p>${pair("cat_"+c+"_s")}</p>
      </div>`;
    for(const s of cats[c].subs){
      const inSub = items.filter(p=>p.sub===s);
      if(!inSub.length) continue;
      html += `<h3 class="sub">${pair("sub_"+s)}</h3>`;
      if(CTX[s]){ const c = CTX[s]; html += `<p class="ctx">${pair(c.key)}${c.url?` <a href="${c.url}" target="_blank" rel="noopener noreferrer">${c.label}</a>`:""}</p>`; }
      const singles = inSub.filter(p=>!p.group);
      const grouped = inSub.filter(p=>p.group==="72");
      if(singles.length) html += gridFor(singles);
      if(grouped.length){
        html += `<div class="collection" role="group" aria-label="${GROUP_72.title}">

/* ============ LANGUAGE ============ */
function applyLang(l){
  LANG = (l==="en") ? "en" : "hr";
  const root = document.documentElement;
  root.lang = LANG; root.dataset.lang = LANG;
  document.title = T[LANG].meta_title;
  const md = document.querySelector('meta[name="description"]'); if(md) md.content = T[LANG].meta_desc;
  document.querySelectorAll("[data-set-lang]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.setLang===LANG)));
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>el.setAttribute("aria-label", T[LANG][el.dataset.i18nAria]));
  document.querySelectorAll("[data-play]").forEach(b=>{
    const p = PROJECTS.find(x=>x.id==b.dataset.play); if(p) b.setAttribute("aria-label", `${T[LANG].play}: ${p.title[LANG]}`);
  });
  document.querySelectorAll("a.poster[href]").forEach(a=>{
    const card = a.closest(".card"); const p = PROJECTS.find(x=>"p"+x.id===card.id);
    if(p) a.setAttribute("aria-label", `${T[LANG].open_ig}: ${p.title[LANG]}`);
  });
  try{ localStorage.setItem("ab-lang", LANG); }catch(e){}
}

/* ============ INIT ============ */
function init(){
  // static strings
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.innerHTML = pair(el.dataset.i18n); });
  renderFilters(); renderCatalog(); renderCV(); enhanceMedia();

  // language: ?lang= > saved > Croatian default
  let start = "hr";
  try{
    const q = new URLSearchParams(location.search).get("lang");
    const saved = localStorage.getItem("ab-lang");
    start = (q==="en"||q==="hr") ? q : (saved==="en"||saved==="hr" ? saved : "hr");
  }catch(e){}
  applyLang(start);

  document.querySelectorAll("[data-set-lang]").forEach(b=>b.addEventListener("click",()=>applyLang(b.dataset.setLang)));

  // filters
  $("#filters").addEventListener("click", e=>{
    const b = e.target.closest("[data-filter]"); if(!b) return;
    const f = b.dataset.filter;
    document.querySelectorAll("#filters button").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
    document.querySelectorAll(".cat").forEach(c=>{ c.hidden = !(f==="all" || c.dataset.cat===f); });
  });

  // YouTube: click-to-play inline (players load only on demand)
  $("#catalog").addEventListener("click", e=>{
    const b = e.target.closest("[data-play]");
    if(b){
      const p = PROJECTS.find(x=>x.id==b.dataset.play); const id = p && ytId(p.url);
      const cardEl = b.closest(".card"); const note = cardEl.querySelector(".note");
      if(!id){ window.open(p.url,"_blank","noopener,noreferrer"); return; }
      const wrap = document.createElement("div");
      wrap.className = "poster land"; wrap.style.cursor="default";
      wrap.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" title="${(p.ytTitle||p.title[LANG]).replace(/"/g,"&quot;")}"
        allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
      b.replaceWith(wrap);
      active = {type:"yt", cardEl, wrap, poster:b, note};
      if(note){ note.innerHTML = pair("embed_note"); note.hidden = false; }
      return;
    }
    const g = e.target.closest("[data-igplay]");
    if(g){ openIG(PROJECTS.find(x=>x.id==g.dataset.igplay)); }
  });

  // If the host's security policy blocks an embed, fall back to the clean link card
  document.addEventListener("securitypolicyviolation", ev=>{
    if(!active) return;
    if(!/frame|child/.test(ev.violatedDirective||"")) return;
    if(active.type==="yt"){
      active.wrap.replaceWith(active.poster);
      if(active.note){ active.note.innerHTML = pair("embed_fail"); active.note.hidden = false; }
    } else if(active.type==="ig"){
      const f = active.dlg.querySelector("iframe"); if(f) f.remove();
      const m = document.createElement("p"); m.className="fail";
      m.innerHTML = `${pair("embed_fail")} <a href="${active.p.url}" target="_blank" rel="noopener noreferrer">${pair("open_ig")}</a>`;
      active.dlg.appendChild(m);
    }
    active = null;
  });
}

let active = null;

/* Instagram: official embed endpoint, loaded only when asked, shown in a dialog */
function openIG(p){
  const base = p.url.split("?")[0].replace(/\/?$/,"/");
  const dlg = document.createElement("dialog"); dlg.className="ig";
  dlg.setAttribute("aria-label", p.title[LANG]);
  dlg.innerHTML = `<div class="dh"><span>${pairObj(p.title)}</span><span><a href="${p.url}" target="_blank" rel="noopener noreferrer" style="color:var(--red);margin-right:12px">${pair("open_ig")}</a><button type="button" data-close>${pair("close")}</button></span></div>
    <iframe src="${base}embed/" title="Instagram: ${p.title.en.replace(/"/g,"&quot;")}" loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  document.body.appendChild(dlg);
  dlg.addEventListener("click", ev=>{ if(ev.target===dlg || ev.target.closest("[data-close]")) dlg.close(); });
  dlg.addEventListener("close", ()=>{ dlg.remove(); if(active && active.dlg===dlg) active=null; });
  active = {type:"ig", dlg, p};
  dlg.showModal();
}

/* YouTube thumbnails + original titles: progressive enhancement.
   On hosts that allow it these load automatically; otherwise the typographic poster stays. */
function enhanceMedia(){
  PROJECTS.filter(p=>p.platform==="youtube").forEach(p=>{
    const id = ytId(p.url); if(!id) return;
    const poster = document.querySelector(`#p${p.id} .poster`);
    const im = new Image(); im.className="thumb"; im.alt="";
    im.onload = ()=>{ if(im.naturalWidth>200 && poster.isConnected){ poster.prepend(im); poster.classList.add("has-thumb"); } };
    im.src = `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
    if(p.ytTitle){ setTitle(p, p.ytTitle); return; }
    try{
      const ctl = new AbortController(); setTimeout(()=>ctl.abort(), 5000);
      fetch(`https://www.youtube.com/oembed?format=json&url=${encodeURIComponent("https://www.youtube.com/watch?v="+id)}`,{signal:ctl.signal})
        .then(r=>r.ok?r.json():null).then(j=>{ if(j && j.title) setTitle(p, j.title); }).catch(()=>{});
    }catch(e){}
  });
}
function setTitle(p, title){
  p.ytTitle = title;
  document.querySelectorAll(`#p${p.id} .ctitle, #p${p.id} .ptitle`).forEach(el=>{ el.textContent = title; });
}
init();
